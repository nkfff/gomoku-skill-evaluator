<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五子棋 · 棋力评估</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"PingFang SC",sans-serif;margin:0;background:#f2f4f8;color:#1f2937}.wrap{max-width:1150px;margin:24px auto;padding:12px;display:grid;grid-template-columns:minmax(0,680px) minmax(285px,1fr);gap:18px}.panel{background:white;padding:20px;border-radius:16px;box-shadow:0 3px 20px #0001}h1{font-size:23px;margin:0 0 10px}h2{font-size:16px;margin:20px 0 8px}.sub,.note{color:#667085;font-size:13px;line-height:1.7}canvas{display:block;width:100%;height:auto;border-radius:8px;background:#d9b678;cursor:crosshair;touch-action:manipulation}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:10px 12px;font-weight:600;cursor:pointer}button.secondary{background:#e9eef8;color:#24344b}button:disabled{opacity:.45}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc}.stat small{display:block;color:#667085}.stat strong{font-size:19px}.log,.report{white-space:pre-wrap;background:#f8fafc;padding:12px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;line-height:1.7;max-height:350px;overflow:auto}.log{max-height:145px}.tablebox{overflow:auto;max-height:240px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb}thead{position:sticky;top:0;background:#fff}@media(max-width:900px){.wrap{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><main class="wrap"><section class="panel"><h1>五子棋 · 棋力评估版</h1><p class="sub">你执黑先手，AI 执白。15×15 无禁手，自由五子棋。记录坐标、每手思考时间和悔棋事件；报告是启发式参考分，不等于段位。</p><canvas id="board" width="660" height="660"></canvas><div class="buttons"><button id="restart">重新开始</button><button class="secondary" id="undo">悔棋</button><button class="secondary" id="report">生成报告</button><button class="secondary" id="export">导出 JSON</button><button class="secondary" id="copy">复制报告</button></div><p class="note">点击棋盘交叉点落子。红点表示最后一手；本地运行，不上传棋谱。</p></section><section class="panel"><div class="stats"><div class="stat"><small>对局状态</small><strong id="status">轮到你</strong></div><div class="stat"><small>对局时间</small><strong id="elapsed">00:00</strong></div><div class="stat"><small>本手思考</small><strong id="thinking">0.0 s</strong></div><div class="stat"><small>悔棋次数</small><strong id="undos">0</strong></div></div><h2>最近记录</h2><div id="log" class="log"></div><h2>落子明细</h2><div class="tablebox"><table><thead><tr><th>手数</th><th>棋手</th><th>坐标</th><th>用时</th><th>评语</th></tr></thead><tbody id="moves"></tbody></table></div><h2>棋力报告</h2><div id="reportbox" class="report">落子后点击「生成报告」。</div></section></main>
<script>
"use strict";
const N=15,L=225,M=30,STEP=600/14,D=[[1,0],[0,1],[1,1],[1,-1]];
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),$=id=>document.getElementById(id);
const at=(r,c)=>15*r+c,inside=(r,c)=>r>=0&&r<15&&c>=0&&c<15;
const label=i=>"ABCDEFGHIJKLMNO"[i%15]+(Math.floor(i/15)+1);
let g,timeout=null,serial=0,reportText="";
function win(b,i,p){let r=Math.floor(i/15),c=i%15;for(const [dr,dc] of D){let count=1;for(const s of [-1,1]){let y=r+dr*s,x=c+dc*s;while(inside(y,x)&&b[at(y,x)]===p){count++;y+=dr*s;x+=dc*s;}}if(count>=5)return true;}return false;}
function nearby(b){let s=new Set(),any=false;for(let i=0;i<L;i++)if(b[i]){any=true;let r=Math.floor(i/15),c=i%15;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let y=r+dr,x=c+dc;if(inside(y,x)&&!b[at(y,x)])s.add(at(y,x));}}return any?[...s]:[112];}
function wins(b,p,c){let out=[];for(let i of c){b[i]=p;if(win(b,i,p))out.push(i);b[i]=0;}return out;}
function pattern(b,i,p){let r=Math.floor(i/15),c=i%15,score=0,open3=0,fours=0,open4=0;for(const [dr,dc] of D){let str="";for(let k=-5;k<=5;k++){let y=r+dr*k,x=c+dc*k,v=k===0?p:inside(y,x)?b[at(y,x)]:-1;str+=v===p?"X":v===0?".":"O";}if(str.includes("XXXXX"))return {score:1e8,open3,fours,open4};if(str.includes(".XXXX.")){score+=300000;open4++;fours++;}else if(["XXXX.",".XXXX","XXX.X","XX.XX","X.XXX"].some(v=>str.includes(v))){score+=40000;fours++;}else if([".XXX.",".XX.X.",".X.XX."].some(v=>str.includes(v))){score+=7000;open3++;}else if([".XX.",".X.X."].some(v=>str.includes(v)))score+=500;else score+=20;}if(fours>=2)score+=550000;if(open3>=2)score+=85000;if(fours&&open3)score+=230000;return {score,open3,fours,open4};}
function grade(b,i,p){let a=pattern(b,i,p).score,z=pattern(b,i,3-p).score,r=Math.floor(i/15),c=i%15;return 1.12*a+z+14-Math.abs(r-7)-Math.abs(c-7);}
function computer(b){let c=nearby(b),w=wins(b,2,c);if(w.length)return {i:w[0],tag:"直接成五"};w=wins(b,1,c);if(w.length)return {i:w[0],tag:"堵住成五"};c.sort((a,z)=>grade(b,z,2)-grade(b,a,2)||a-z);return {i:c[0],tag:"棋形评分"};}
function assess(b,i){let c=nearby(b),my=wins(b,1,c),their=wins(b,2,c),rank=[...c].sort((a,z)=>grade(b,z,1)-grade(b,a,1)).indexOf(i)+1,p=pattern(b,i,1);let cat="normal",tag="普通落子";if(my.length){cat=my.includes(i)?"win":"miss_win";tag=cat==="win"?"抓住直接胜点":"漏掉直接胜点";}else if(their.length){cat=their.includes(i)?"block":"miss_block";tag=cat==="block"?"及时挡住胜点":"漏防直接胜点";}else if(p.open4){cat="open4";tag="形成活四";}else if(p.fours>=2){cat="double4";tag="形成双四";}else if(p.open3>=2){cat="double3";tag="形成双活三";}else if(p.fours){cat="four";tag="形成冲四";}else if(p.open3){cat="three";tag="形成活三";}else if(rank<=3){cat="candidate";tag="启发式高分候选";}return {tag,cat,rank};}
function draw(){ctx.fillStyle="#d9b678";ctx.fillRect(0,0,660,660);ctx.strokeStyle="#78552f";ctx.lineWidth=1;for(let a=0;a<15;a++){let x=M+a*STEP;ctx.beginPath();ctx.moveTo(M,x);ctx.lineTo(630,x);ctx.moveTo(x,M);ctx.lineTo(x,630);ctx.stroke();}for(let r of [3,7,11])for(let c of [3,7,11]){ctx.fillStyle="#714921";ctx.beginPath();ctx.arc(M+c*STEP,M+r*STEP,3.5,0,Math.PI*2);ctx.fill();}g.moves.forEach((m,n)=>{let x=M+(m.i%15)*STEP,y=M+Math.floor(m.i/15)*STEP;ctx.beginPath();ctx.arc(x,y,STEP*.4,0,2*Math.PI);let gr=ctx.createRadialGradient(x-6,y-7,1,x,y,STEP*.4);if(m.p===1){gr.addColorStop(0,"#555");gr.addColorStop(1,"#101014");}else{gr.addColorStop(0,"#fff");gr.addColorStop(1,"#d9d9d9");}ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle="#777";ctx.stroke();if(n===g.moves.length-1){ctx.fillStyle=m.p===1?"#ffb33d":"#d22";ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}});}
function update(){let t=(performance.now()-g.begin)/1000;$("elapsed").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");$("thinking").textContent=g.turn===1?((performance.now()-g.turnStart)/1000).toFixed(1)+" s":g.turn===2?"AI 行棋":"—";$("status").textContent=g.result===1?"你赢了！":g.result===2?"AI 获胜":g.result===3?"平局":g.turn===2?"AI 思考中":"轮到你";$("undos").textContent=g.undos;$("undo").disabled=!g.moves.length;}
function redraw(){draw();update();$("log").textContent=g.moves.slice(-7).map(m=>m.n+". "+(m.p===1?"你":"AI")+" "+label(m.i)+" · "+m.think.toFixed(1)+" s · "+m.tag).join("\n")||"等待你的第一步……";$("moves").innerHTML=g.moves.map(m=>"<tr><td>"+m.n+"</td><td>"+(m.p===1?"黑":"白")+"</td><td>"+label(m.i)+"</td><td>"+m.think.toFixed(1)+"s</td><td>"+m.tag+"</td></tr>").join("");}
function reset(){if(timeout)clearTimeout(timeout);serial++;let now=performance.now();g={b:Array(L).fill(0),moves:[],events:[],undos:0,begin:now,turnStart:now,startISO:new Date().toISOString(),turn:1,result:0};reportText="";$("reportbox").textContent="落子后点击「生成报告」。";redraw();}
function move(i,p,think,tag,cat="",rank=null){g.b[i]=p;let m={n:g.moves.length+1,p,i,coord:label(i),think,tag,cat,rank,time:new Date().toISOString()};g.moves.push(m);g.events.push({type:"move",...m});if(win(g.b,i,p))g.result=p;else if(g.moves.length===L)g.result=3;if(g.result){g.turn=0;g.events.push({type:"end",result:g.result,time:new Date().toISOString()});}}
function human(i){if(g.turn!==1||g.b[i]||g.result)return;let think=(performance.now()-g.turnStart)/1000,a=assess(g.b,i);move(i,1,think,a.tag,a.cat,a.rank);if(!g.result){g.turn=2;let version=serial,t0=performance.now();timeout=setTimeout(()=>{timeout=null;if(serial!==version||g.turn!==2)return;let a=computer(g.b);move(a.i,2,(performance.now()-t0)/1000,a.tag);if(!g.result){g.turn=1;g.turnStart=performance.now();}redraw();},130);}redraw();}
function undo(){if(!g.moves.length)return;if(timeout)clearTimeout(timeout);timeout=null;serial++;let n=g.moves[g.moves.length-1].p===2?2:1,reverted=g.moves.splice(-n,n);for(let m of reverted)g.b[m.i]=0;g.undos++;g.events.push({type:"undo",moves:reverted.map(m=>({n:m.n,coord:m.coord})),time:new Date().toISOString()});g.result=0;g.turn=1;g.turnStart=performance.now();redraw();}
function makeReport(){let h=g.moves.filter(m=>m.p===1);if(!h.length){$("reportbox").textContent="尚无棋谱可分析。";return;}let counts={};for(let m of h)counts[m.cat]=(counts[m.cat]||0)+1;let total=h.reduce((s,m)=>s+m.think,0),avg=total/h.length,good=(counts.win||0)+(counts.block||0)+(counts.open4||0)+(counts.double4||0)+(counts.double3||0),bad=(counts.miss_win||0)+(counts.miss_block||0),top=h.filter(m=>m.rank<=3).length,score=Math.max(0,Math.min(100,Math.round(65+good*4+Math.min(12,top/h.length*12)-bad*18-Math.min(15,g.undos*2))));let errors=h.filter(m=>m.cat==="miss_win"||m.cat==="miss_block");reportText=["五子棋棋力评估（非专业引擎）","结果："+({0:"未结束",1:"你获胜",2:"AI 获胜",3:"平局"}[g.result]),"综合参考分："+score+"/100（不能换算为 Elo 或段位）","","行为统计","黑棋落子："+h.length+" 手","平均思考："+avg.toFixed(1)+" 秒；累计："+total.toFixed(1)+" 秒","悔棋次数："+g.undos,"直接获胜着："+(counts.win||0)+"；关键防守："+(counts.block||0),"漏杀："+(counts.miss_win||0)+"；漏防："+(counts.miss_block||0),"形成活四："+(counts.open4||0)+"；双四："+(counts.double4||0)+"；双活三："+(counts.double3||0),"启发式排名前三："+top+"/"+h.length+" 手","","需复盘的失误",...(errors.length?errors.map(m=>"第 "+m.n+" 手 "+m.coord+"："+m.tag+"，思考 "+m.think.toFixed(1)+" 秒"):["有效棋谱中未发现一步成五层面的漏杀漏防。"]),"","说明：评分仅为同一工具内部参考，无法检查完整 VCF/VCT 多步杀法，思考时间与悔棋本身不能证明棋力。"].join("\n");$("reportbox").textContent=reportText;}
function exportData(){if(!reportText)makeReport();let payload={app:"gomoku-skill-evaluator",version:"1.0.0",rules:"15x15 freestyle",start:g.startISO,exported:new Date().toISOString(),outcome:g.result,undoCount:g.undos,moves:g.moves,events:g.events,report:reportText};let url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="gomoku-evaluation.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
canvas.addEventListener("click",e=>{let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*660/rect.width,y=(e.clientY-rect.top)*660/rect.height,c=Math.round((x-M)/STEP),r=Math.round((y-M)/STEP);if(inside(r,c)&&Math.hypot(x-(M+c*STEP),y-(M+r*STEP))<STEP*.49)human(at(r,c));});
$("restart").onclick=reset;$("undo").onclick=undo;$("report").onclick=makeReport;$("export").onclick=exportData;$("copy").onclick=async()=>{if(!reportText)makeReport();try{await navigator.clipboard.writeText(reportText);alert("报告已复制");}catch{alert("复制失败，请手动复制");}};
reset();setInterval(update,150);
</script></body></html>

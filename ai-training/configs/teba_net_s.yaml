model:
  name: TEBA-Net-S
  board_size: 15
  input_channels: 3
  residual_channels: 32
  residual_blocks: 4
  group_norm_groups: 8
  activation: relu
  policy_head:
    output_channels: 1
    output_size: 225
  value_head:
    pooling: global_average
    hidden_units: 64
    output_units: 1
    activation: tanh
  tactical_head:
    output_channels: 3
    labels:
      - WIN_NOW
      - MUST_BLOCK
      - FORK
    label_priority:
      - WIN_NOW
      - MUST_BLOCK
      - FORK
    definitions:
      WIN_NOW: "All legal moves that win immediately for the side to move."
      MUST_BLOCK: "Opponent immediate-winning cells, only when the side to move has no immediate win."
      FORK: "Moves that create at least two distinct immediate winning replies."
    forced_loss_rule: "Two or more opponent immediate-winning cells cannot all be blocked by one move."
  expected_trainable_parameters: 77477

loss:
  policy: masked_soft_target_cross_entropy
  value: mean_squared_error
  tactical: class_balanced_binary_cross_entropy
  tactical_weight: 0.2
  total: "policy + value + 0.2 * tactical"

optimizer:
  name: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0

training:
  device: mps
  precision: float32
  bootstrap:
    synthetic_rule_verified_positions: 1200
    optimizer_updates: 100
    supervised_heads:
      - policy
      - tactical
    value_head: self_play_only
  self_play:
    rounds: 3
    games_per_round: 4
    max_plies: 225
    temperature_moves: 12
    simulations: 16
    c_puct: 1.25
  optimizer:
    name: AdamW
    learning_rate: 0.0003
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    warmup_steps: 20
  batch_size: 32
  replay_buffer_positions: 50000
  gradient_updates_per_round: 50
  tactical_loss_weight: 0.2
  checkpoint_every_round: true
  resume_from_latest: true

search:
  algorithm: neural_puct
  simulations: 128
  c_puct: 1.25
  candidate_radius: 2
  tactical_prior_weights:
    win_now: 0.25
    must_block: 0.25
    fork: 0.15
  root_dirichlet_noise:
    enabled_for_self_play: true
    alpha: 0.3
    fraction: 0.25
  inference:
    default_device: mps
    evaluation_batch_size: 1
  exact_rule_overrides:
    immediate_win: true
    unique_immediate_block: true
    multiple_opponent_winning_cells: report_forced_loss

name: V3.2/V3.3 AI and special modes checks

on:
  push:
    branches: [main, feature/v3.2-special-modes-frontend]
    paths:
      - "v3.2/**"
      - "v3.3/**"
      - "v3.4/**"
      - ".github/workflows/v3.2-mode-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "v3.2/**"
      - "v3.3/**"
      - "README.md"
      - ".github/workflows/v3.2-mode-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax for V3.2 and V3.3
        run: |
          for version in v3.2 v3.3 v3.4; do
            node --check "$version/src/app.js"
            node --check "$version/src/account.js"
            node --check "$version/src/assessment.js"
            node --check "$version/src/engine.js"
            node --check "$version/src/ai.worker.js"
            node --check "$version/src/special-modes.js"
            node --check "$version/special-modes-ui.js"
            node --check "$version/pvp-ui.js"
          done
      - name: Test AI, puzzle generation and random connect engine
        run: |
          for version in v3.2 v3.3; do
            node --experimental-default-type=module --test "$version"/test/*.test.js
          done
      - name: Verify UI and API wiring for both versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for version in ("v3.2", "v3.3", "v3.4"):
              html = Path(f"{version}/index.html").read_text(encoding="utf-8")
              app = Path(f"{version}/src/app.js").read_text(encoding="utf-8")
              ui = Path(f"{version}/special-modes-ui.js").read_text(encoding="utf-8")
              config = Path(f"{version}/config.js").read_text(encoding="utf-8")
              required = [
                  "tab-puzzle", "tab-random", "panel-puzzle", "panel-random",
                  "puzzleBoard", "puzzleNew", "puzzleRetryClaim", "randomBoard",
                  "randomNew", "randomRestart", "tab-pvp", "pvpBoard"
              ]
              missing = [item for item in required if f'id="{item}"' not in html]
              if missing:
                  raise SystemExit(f"{version}: missing UI elements: {missing}")
              for asset in ["./src/app.js", "./pvp-ui.js", "./special-modes-ui.js"]:
                  if asset not in html:
                      raise SystemExit(f"{version}: missing page asset {asset}")
              for marker in ['"puzzle","random"', "gomoku:tab-change", "gomokuApplyModeProfile", "gomokuAwardLocalModePoints"]:
                  if marker not in app:
                      raise SystemExit(f"{version}: missing app integration marker {marker}")
              for marker in ['"/api/modes/puzzle/"+path', 'modeApi("new"', 'modeApi("claim"', "chooseRandomMove", "createRandomConfig"]:
                  if marker not in ui:
                      raise SystemExit(f"{version}: missing special mode behavior {marker}")
              if "GOMOKU_PVP_API_URL" not in config:
                  raise SystemExit(f"{version}: PVP API URL is missing")
              if version in ("v3.3", "v3.4") and ("王者" not in html or version.upper() not in html):
                  raise SystemExit(f"{version} title or King difficulty label is missing")
              if version == "v3.4":
                  if 'const selectedLevel=$("difficulty").value;' not in app or 'game.level=LEVELS[selectedLevel]?selectedLevel:"normal";' not in app:
                      raise SystemExit("V3.4 must freeze the selected difficulty before starting a game")
                  if 'new Worker(new URL("./ai.worker.js"' not in app:
                      raise SystemExit("V3.4 standard AI must run in a Worker")
                  worker = Path("v3.4/src/ai.worker.js").read_text(encoding="utf-8")
                  if 'chooseRandomMove' not in worker or 'chooseAI' not in worker:
                      raise SystemExit("V3.4 AI Worker must support both game modes")
              print(f"{version} UI wiring OK")
          PY

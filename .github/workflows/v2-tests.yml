name: V2 engine tests
on:
  push:
    branches: [feature/v2-major-upgrade, feature/v2.1-scoring, feature/v2.2-accounts-customization]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run deterministic engine tests
        run: npm test
      - name: Verify front-end and Worker JavaScript syntax
        run: npm run check

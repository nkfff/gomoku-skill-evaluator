name: V2 engine tests
on:
  push:
    branches: [feature/v2-major-upgrade]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic engine tests
        run: npm test

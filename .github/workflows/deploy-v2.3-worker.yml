name: Deploy V2.3 Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing V2.3 backend source
        required: true
        default: feature/v2.3-local-first-cat-theme

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -eu
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$D1_ID" || (echo "Missing CLOUDFLARE_D1_DATABASE_ID" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)

      - name: Checkout V2.3 source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and check source
        run: |
          npm install
          npm run check
          npm test

      - name: Configure Cloudflare database binding
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("wrangler.toml")
          text = p.read_text()
          db_id = os.environ["D1_ID"].strip()
          if not db_id or db_id == "REPLACE_WITH_YOUR_D1_DATABASE_ID":
              raise SystemExit("Set CLOUDFLARE_D1_DATABASE_ID to the actual D1 database UUID.")
          if "REPLACE_WITH_YOUR_D1_DATABASE_ID" not in text:
              raise SystemExit("Expected D1 placeholder was not found; refusing to overwrite config.")
          p.write_text(text.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID", db_id))
          PY

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply gomoku-v2 --remote

      - name: Configure Supabase URL in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL

      - name: Configure administrator UUID if provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        if: env.ADMIN_USER_ID != ''
        run: printf '%s' "$ADMIN_USER_ID" | npx wrangler secret put ADMIN_USER_ID

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

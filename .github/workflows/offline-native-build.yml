name: Offline Native Android and iOS
on:
  pull_request:
    paths:
      - 'offline/**'
      - '.github/workflows/offline-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Accept Android SDK licenses on hosted runner
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' || true
      - run: python3 -m pip install -r offline/requirements.txt
      - name: Install pinned Capacitor dependencies
        working-directory: offline
        run: npm install --no-audit --no-fund
      - name: Generate Android project with bundled offline model and icons
        working-directory: offline
        run: npm run native:android
      - name: Build locally installable debug APK
        working-directory: offline/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gomoku-offline-android-debug-apk
          path: offline/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    name: iOS simulator app (not a signed IPA)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cairo for macOS icon rendering
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib:/opt/homebrew/lib" >> "$GITHUB_ENV"
      - run: python3 -m pip install -r offline/requirements.txt
      - name: Install pinned Capacitor dependencies
        working-directory: offline
        run: npm install --no-audit --no-fund
      - name: Generate iOS project with bundled offline model and icons
        working-directory: offline
        run: npm run native:ios
      - name: Compile unsigned iOS simulator app
        working-directory: offline
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/gomoku-ios-build" build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gomoku-offline-ios-simulator-app
          path: ${{ runner.temp }}/gomoku-ios-build/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error

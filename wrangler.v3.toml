name = "gomoku-v3-api"
main = "worker/v3.js"
compatibility_date = "2026-10-01"

[vars]
FRONTEND_ORIGIN = "https://nkfff.github.io"

# Reuse the existing V2.2 D1 database so account UUIDs and custom display names remain available.
# V3.0 only adds pvp_* tables through 0003_pvp.sql. Back up D1 before production migration.
[[d1_databases]]
binding = "DB"
database_name = "gomoku-v2"
database_id = "REPLACE_WITH_V2_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PVP_ROOMS"
class_name = "PvpRoom"

[[migrations]]
tag = "v3-pvp-v1"
new_sqlite_classes = ["PvpRoom"]
